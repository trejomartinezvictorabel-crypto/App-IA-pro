name: Compilar APK desde ZIP Automático

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  build-from-zip:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Unzip, check missing files and auto-complete project
        run: |
          echo "Searching for .zip files..."
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting: $file"
              unzip -o "$file" -d .
            fi
          done
          
          # Si el ZIP no traía gradlew, se genera automáticamente para evitar fallos
          if [ ! -f "gradlew" ]; then
            echo "Generating missing Gradle Wrapper..."
            gradle wrapper
          fi

          # Si falta el archivo local.properties necesario para Android SDK, crearlo
          if [ ! -f "local.properties" ]; then
            echo "Creating missing local.properties..."
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi

      - name: 4. Accept Android licenses and build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-multimodal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
